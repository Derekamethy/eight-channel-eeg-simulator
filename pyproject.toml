[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eight-channel-eeg-simulator"
version = "0.1.0"
description = "Eight-channel EEG desktop simulator and verification proof of concept"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Yangdeyi Yang"}]
dependencies = [
  "numpy>=1.26,<3",
  "PySide6>=6.7,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
edf = ["pyedflib>=0.1.38"]

[tool.setuptools]
packages = ["eeg_simulator", "eeg_simulator.device"]
