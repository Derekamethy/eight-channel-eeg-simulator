name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install project
        run: python -m pip install -e .
      - name: Install web demo dependencies
        run: python -m pip install -r web_demo/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q eeg_simulator app.py web_demo tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Release consistency checks
        run: python scripts/check_release.py
      - name: GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app.py --smoke-test
